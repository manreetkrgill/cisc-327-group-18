name: Python Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unit tests with coverage (E2E tests need a live server)
      run: |
        export PYTHONPATH=.
        python -m pytest tests --ignore=tests/e2e -v --cov=app --cov-report=term-missing --cov-fail-under=90

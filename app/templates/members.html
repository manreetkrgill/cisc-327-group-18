{% extends "base.html" %}
{% block content %}
<h1>Members</h1>
<table>
  <tr>
    <th>ID</th><th>Name</th><th>Email</th><th>Membership Date</th><th></th>
  </tr>
  {% for member in members %}
  <tr>
    <td>{{ member.id }}</td>
    <td>{{ member.name }}</td>
    <td>{{ member.email }}</td>
    <td>{{ member.membership_date }}</td>
    <td>
      <form class="delete-form" method="post" action="{{ url_for('views.delete_member_page', member_id=member.id) }}">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<h2>Add a Member</h2>
<form method="post" action="{{ url_for('views.members_page') }}">
  <label>Name <input type="text" name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <button type="submit">Add Member</button>
</form>
{% endblock %}

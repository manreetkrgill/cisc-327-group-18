{% extends "base.html" %}
{% block content %}
<h1>Books</h1>
<table>
  <tr>
    <th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Total</th><th>Available</th><th></th>
  </tr>
  {% for book in books %}
  <tr>
    <td>{{ book.id }}</td>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
    <td>{{ book.isbn }}</td>
    <td>{{ book.total_copies }}</td>
    <td>{{ book.available_copies }}</td>
    <td>
      <form class="delete-form" method="post" action="{{ url_for('views.delete_book_page', book_id=book.id) }}">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<h2>Add a Book</h2>
<form method="post" action="{{ url_for('views.books_page') }}">
  <label>Title <input type="text" name="title" required></label>
  <label>Author <input type="text" name="author" required></label>
  <label>ISBN <input type="text" name="isbn" required></label>
  <label>Total Copies <input type="number" name="total_copies" value="1" min="1" required></label>
  <button type="submit">Add Book</button>
</form>
{% endblock %}
